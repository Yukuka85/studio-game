<title>Студия DPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Один «ночной» мир, как в референсе: индиго-стены, тёплое дерево, лампа. Сцена — canvas, окна и доска — DOM поверх. */
:root {
  color-scheme: dark;
  --bg: #15173A;
  --wall: #2E3266;
  --panel: #1E2150;
  --panel-2: #282C63;
  --line: #474C8E;
  --ink: #F3EBDD;
  --ink-dim: #B9B3C9;
  --lamp: #FFC94A;
  --berry: #FF7AA8;
  --st-free: #7ED7C1;
  --st-calm: #9BD86A;
  --st-flow: #FFD36A;
  --st-over: #FF6B5E;
  --st-away: #8FB8FF;
  --shadow: #0B0C24;
  --f-display: "Press Start 2P", "Courier New", monospace;
  --f-body: "Pixelify Sans", "PT Mono", "Courier New", monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; padding-inline: 16px; padding-block: 8px; gap: 8px; }

/* ---------- верхняя панель ---------- */
.top { grid-row: 1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand { font-family: var(--f-display); font-size: 14px; letter-spacing: .06em; color: var(--lamp); text-shadow: 2px 2px 0 var(--shadow); white-space: nowrap; }
.brand small { font-size: 8px; color: var(--ink-dim); margin-left: 6px; letter-spacing: .1em; }
.clock { font-family: var(--f-display); font-size: 10px; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.pbtn { background: var(--panel-2); border: 0; box-shadow: inset 0 0 0 2px var(--line), 3px 3px 0 var(--shadow); padding: 6px 10px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.pbtn:hover { box-shadow: inset 0 0 0 2px var(--lamp), 3px 3px 0 var(--shadow); }
.pbtn:active { transform: translate(2px, 2px); box-shadow: inset 0 0 0 2px var(--lamp), 1px 1px 0 var(--shadow); }
.pbtn[aria-pressed="true"] { background: #4A3F1E; box-shadow: inset 0 0 0 2px var(--lamp), 3px 3px 0 var(--shadow); }
.pbtn.primary { background: var(--lamp); color: #2A2200; box-shadow: inset 0 0 0 2px #FFE59A, 3px 3px 0 var(--shadow); font-weight: 600; }
.pbtn.danger { background: #5A2430; }
.pbtn[disabled] { opacity: .45; cursor: not-allowed; }
select.pbtn { appearance: none; padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.proto { font-size: 12px; color: var(--ink-dim); }

/* ---------- полоса доски на телефоне ---------- */
.strip { grid-row: 2; display: none; overflow-x: auto; gap: 8px; padding-bottom: 4px; touch-action: pan-x; scrollbar-width: thin; }
.compact .strip { display: flex; }

/* ---------- сцена ---------- */
.scene { grid-row: 3; position: relative; min-height: 0; overflow: hidden; background: var(--bg); touch-action: none; user-select: none; -webkit-user-select: none; }
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.board { position: absolute; pointer-events: auto; display: flex; flex-direction: column; gap: calc(var(--u) * 1px); padding: calc(var(--u) * 1.4px) calc(var(--u) * 2px) calc(var(--u) * 2px); cursor: zoom-in; }
.bhead { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-family: var(--f-display); font-size: calc(var(--u) * 2.3px); color: #3A3355; text-transform: uppercase; letter-spacing: .04em; }
.bhead b { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bopen { border: 0; background: #FFC94A; color: #2A2200; font: inherit; font-size: calc(var(--u) * 2.1px); padding: calc(var(--u) * .5px) calc(var(--u) * 1.2px); cursor: pointer; box-shadow: calc(var(--u) * .4px) calc(var(--u) * .4px) 0 rgba(30,20,60,.35); white-space: nowrap; }
.bcols { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: minmax(0, 1fr); gap: calc(var(--u) * 1.2px); }
.compact .board { display: none; }
.col { display: flex; flex-direction: column; gap: calc(var(--u) * 1px); min-width: 0; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.col.many .card .nm { -webkit-line-clamp: 1; }
.col.many .card .meta { margin-top: 0; }
.col h4 { margin: 0; font-family: var(--f-display); font-size: calc(var(--u) * 2.2px); color: #3A3355; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: calc(var(--u) * .6px); border-bottom: calc(var(--u) * .5px) solid #B8B0CC; }
.card { position: relative; background: var(--cc, #FFE38A); color: #2A2340; font-size: calc(var(--u) * 3.1px); line-height: 1.05; padding: calc(var(--u) * .9px) calc(var(--u) * 1.1px); box-shadow: calc(var(--u) * .5px) calc(var(--u) * .5px) 0 rgba(30,20,60,.35); cursor: grab; touch-action: none; min-width: 0; }
.card .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; font-weight: 600; }
.card .meta { display: flex; justify-content: space-between; gap: 2px; align-items: center; margin-top: calc(var(--u) * .4px); font-size: calc(var(--u) * 2.4px); }
.card .faces { display: flex; gap: 1px; }
.card .faces i { width: calc(var(--u) * 1.8px); height: calc(var(--u) * 1.8px); background: var(--fc); display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.card.tent { opacity: .62; outline: calc(var(--u) * .4px) dashed #6E5A9E; outline-offset: -1px; }
.card.tent::after { content: "?"; position: absolute; right: 2px; top: 0; font-family: var(--f-display); font-size: calc(var(--u) * 2.2px); color: #6E5A9E; }
.card.mine { box-shadow: 0 0 0 calc(var(--u) * .5px) var(--berry), calc(var(--u) * .5px) calc(var(--u) * .5px) 0 rgba(30,20,60,.35); }
.card.burn { animation: burn 0.9s steps(2) infinite; }
.card.burn .dl::before { content: "🔥"; }
.card.late .dl { color: #A8202A; font-weight: 700; }
.card.drop { transform: scale(1.06); box-shadow: 0 0 0 calc(var(--u) * .7px) var(--lamp); }
@keyframes burn { 50% { box-shadow: 0 0 calc(var(--u) * 1.5px) calc(var(--u) * .6px) #FF8A3D; } }
.strip .card { --u: 3; touch-action: pan-x; flex: 0 0 132px; font-size: 13px; padding: 6px 8px; }
.strip .card .meta { font-size: 11px; }
.strip .card .faces i { width: 7px; height: 7px; }
.strip .stg { flex: 0 0 auto; align-self: stretch; writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--f-display); font-size: 8px; color: var(--ink-dim); text-align: center; }

.plate { position: absolute; transform: translate(-50%, 0); pointer-events: auto; cursor: pointer; font-size: calc(var(--u) * 3px); line-height: 1; padding: calc(var(--u) * .6px) calc(var(--u) * 1.2px); background: var(--pc); color: #1C1A30; white-space: nowrap; box-shadow: calc(var(--u) * .5px) calc(var(--u) * .5px) 0 var(--shadow); font-weight: 600; font-variant-numeric: tabular-nums; }
.plate.hi { outline: 2px solid var(--lamp); }
.plate.dim { opacity: .55; }
.mlabel { position: absolute; transform: translate(-50%, -100%); background: #FFE38A; color: #2A2340; font-size: calc(var(--u) * 3.2px); font-weight: 700; padding: calc(var(--u) * .6px) calc(var(--u) * 1.4px); white-space: nowrap; box-shadow: calc(var(--u) * .6px) calc(var(--u) * .6px) 0 var(--shadow); rotate: -2deg; }

/* ---------- большая доска ---------- */
.dock { position: fixed; z-index: 35; left: 50%; top: 56px; transform: translateX(-50%); width: min(1240px, calc(100vw - 32px)); max-height: calc(100% - 170px); background: #F2EEF8; color: #2A2340; box-shadow: 0 0 0 5px #8A6A4A, 0 0 0 8px #5A4030, 10px 10px 0 8px var(--shadow); display: grid; grid-template-rows: auto minmax(0, 1fr); transition: opacity .15s; }
.dock.peek { opacity: .12; pointer-events: none; }
.dock header { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 10px 44px 10px 14px; border-bottom: 2px solid #D6CEE6; }
.dock h2 { margin: 0; font-family: var(--f-display); font-size: 12px; color: #3A3355; }
.dock .x { position: absolute; right: 8px; top: 6px; border: 0; background: transparent; font-family: var(--f-display); font-size: 12px; padding: 6px; cursor: pointer; color: #3A3355; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tbtn { border: 0; background: #E2DCEE; box-shadow: inset 0 0 0 2px #B8B0CC; color: #2A2340; padding: 4px 9px; cursor: pointer; font-size: 13px; }
.tbtn[aria-pressed="true"] { background: #FFC94A; box-shadow: inset 0 0 0 2px #C9952A; }
.dhint { font-size: 13px; color: #6A6080; }
.dock .body { overflow: auto; min-height: 0; }
.kan { display: grid; grid-template-columns: repeat(var(--n), minmax(178px, 1fr)); gap: 12px; padding: 12px 14px 16px; }
.kcol { display: grid; gap: 8px; align-content: start; min-width: 0; }
.kcol h4 { margin: 0; font-family: var(--f-display); font-size: 9px; color: #3A3355; text-transform: uppercase; letter-spacing: .05em; padding-bottom: 4px; border-bottom: 2px solid #B8B0CC; }
.card.big { --u: 3.4; font-size: 14px; padding: 8px 10px; display: grid; gap: 5px; line-height: 1.2; box-shadow: 3px 3px 0 rgba(30,20,60,.3); }
.card.big .r2 { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; }
.card.big .stt { font-size: 12px; color: #4A4060; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.big .team { display: flex; flex-wrap: wrap; gap: 3px; }
.card.big .team i, .tchip { font-style: normal; font-size: 11px; padding: 1px 5px; background: var(--fc); color: #1C1A30; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); white-space: nowrap; }
.card.big .acts { display: flex; gap: 6px; }
.card.big .acts button { font-size: 12px; background: rgba(255,255,255,.6); border: 0; padding: 2px 8px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(42,35,64,.35); color: #2A2340; }
.card.big .acts button:hover { background: #FFFFFF; }
.card.big.tent::after { font-size: 10px; right: 6px; top: 4px; }
.nobody { font-size: 12px; color: #8A80A0; margin: 0; }
.ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ptable th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6A6080; position: sticky; top: 0; background: #F2EEF8; padding: 8px; font-weight: 600; }
.ptable td { padding: 7px 8px; border-top: 1px solid #DCD6EA; vertical-align: top; }
.ptable .sw { width: 8px; padding: 0; background: var(--cc); }
.ptable .stt { color: #4A4060; font-size: 13px; min-width: 220px; }
.ptable tr.trow { cursor: grab; touch-action: pan-y; }
.ptable tr.trow:hover { background: #E8E2F4; }
.ptable tr.burn .dl { color: #C2410C; font-weight: 700; }
.ptable tr.late .dl { color: #A8202A; font-weight: 700; }
.bubble { position: absolute; transform: translate(-50%, -100%); background: #FFFDF6; color: #1C1A30; font-size: 13px; padding: 4px 8px; white-space: nowrap; box-shadow: 2px 2px 0 var(--shadow); font-weight: 600; animation: pop .18s steps(3); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; border: 6px solid transparent; border-top-color: #FFFDF6; border-bottom: 0; transform: translateX(-50%); }
@keyframes pop { from { transform: translate(-50%, -80%) scale(.6); } }
.tip { position: absolute; background: var(--panel); border: 2px solid var(--line); padding: 4px 8px; font-size: 13px; pointer-events: none; white-space: nowrap; box-shadow: 3px 3px 0 var(--shadow); }
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -60%) rotate(-4deg); opacity: .92; }
.zoom { position: absolute; right: 8px; bottom: 8px; pointer-events: auto; display: none; }
.compact .zoom { display: inline-flex; }
.pick { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); pointer-events: auto; background: var(--lamp); color: #2A2200; padding: 6px 10px; font-weight: 600; box-shadow: 3px 3px 0 var(--shadow); display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.pick button { background: #2A2200; color: var(--lamp); border: 0; padding: 2px 8px; cursor: pointer; }

/* ---------- таймлайн ---------- */
.time { grid-row: 4; display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; min-width: 0; }
.days { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; min-width: 0; scrollbar-width: thin; }
.day { flex: 0 0 auto; width: 46px; border: 0; background: var(--panel); box-shadow: inset 0 0 0 2px var(--line); padding: 4px 2px 3px; cursor: pointer; display: grid; gap: 2px; justify-items: center; font-variant-numeric: tabular-nums; }
.day b { font-size: 11px; color: var(--ink-dim); font-weight: 500; }
.day span { font-size: 13px; }
.day i { width: 34px; height: 4px; background: var(--panel-2); display: block; position: relative; }
.day i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--bc); }
.day.sel { background: #3A3270; box-shadow: inset 0 0 0 2px var(--lamp); }
.day.today b { color: var(--lamp); }
.day.wk { margin-left: 8px; }
.hours { display: flex; align-items: center; gap: 8px; }
.hours input { width: 180px; accent-color: var(--lamp); }
.hours output { font-family: var(--f-display); font-size: 10px; width: 46px; font-variant-numeric: tabular-nums; }

/* ---------- окна ---------- */
.win { position: fixed; z-index: 30; background: var(--panel); box-shadow: inset 0 0 0 3px var(--line), 6px 6px 0 var(--shadow); padding: 14px 16px 16px; overflow: auto; }
.panel { right: 20px; top: 64px; width: min(400px, calc(100vw - 32px)); max-height: calc(100% - 170px); }
.win h2 { margin: 0; font-family: var(--f-display); font-size: 13px; line-height: 1.5; text-wrap: balance; }
.win h3 { margin: 16px 0 8px; font-family: var(--f-display); font-size: 9px; letter-spacing: .08em; color: var(--ink-dim); text-transform: uppercase; }
.win .x { position: absolute; right: 8px; top: 8px; border: 0; background: transparent; cursor: pointer; font-family: var(--f-display); font-size: 12px; padding: 6px; }
.who { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.who canvas { image-rendering: pixelated; background: #2B2F66; box-shadow: inset 0 0 0 2px var(--line); }
.role { color: var(--ink-dim); font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; background: var(--c); color: #1C1A30; font-weight: 600; font-size: 13px; }
.fat { margin-top: 8px; }
.fat .bar { height: 10px; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line); position: relative; }
.fat .bar::after { content: ""; position: absolute; inset: 2px auto 2px 2px; width: calc((100% - 4px) * var(--v)); background: var(--fc); }
.fat .bar::before { content: ""; position: absolute; top: 0; bottom: 0; left: 80%; width: 2px; background: var(--ink-dim); z-index: 1; }
.moods { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--ink-dim); }
.moods .up { color: #FFA48F; } .moods .dn { color: #9EE6B8; }
.tasks { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.task { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: start; background: var(--panel-2); padding: 8px; cursor: pointer; }
.task > i { align-self: stretch; background: var(--pc); }
.task .t1 { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.task .t2 { font-size: 13px; color: var(--ink-dim); }
.task .t3 { font-size: 13px; color: var(--ink); margin-top: 2px; font-style: italic; }
.cubes { display: grid; grid-template-columns: repeat(4, 8px); gap: 2px; align-content: start; }
.cubes b { width: 8px; height: 8px; background: var(--pc); }
.cubes b.o { background: var(--st-over); }
.empty { color: var(--ink-dim); font-size: 14px; }
.lock { font-size: 13px; color: var(--ink-dim); margin-top: 8px; }

.tower { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; }
.tcol { display: flex; flex-direction: column-reverse; min-height: 128px; position: relative; background: repeating-linear-gradient(to top, transparent 0 13px, rgba(255,255,255,.05) 13px 14px); padding: 0 6px; }
.tcol::before { content: ""; position: absolute; left: 0; right: 0; bottom: 112px; height: 2px; background: var(--ink-dim); opacity: .6; }
.tcol.drop { background-color: rgba(255,201,74,.12); }
.tcol .seg { background: var(--pc); height: calc(var(--h) * 14px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); cursor: grab; font-size: 11px; color: #1C1A30; overflow: hidden; padding: 0 2px; line-height: 14px; touch-action: none; }
.tcol .seg.over { box-shadow: inset 0 0 0 2px var(--st-over); }
.tcol .seg.sel { outline: 2px solid var(--lamp); }
.tcol .vac { height: 112px; background: repeating-linear-gradient(45deg, #34407A 0 6px, #2B3366 6px 12px); color: var(--st-away); font-size: 12px; display: grid; place-items: center; }
.tlab { text-align: center; font-size: 12px; color: var(--ink-dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
.tlab.sel { color: var(--lamp); }
.segbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 13px; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--ink-dim); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.heat { display: grid; grid-template-columns: 70px repeat(20, 1fr); gap: 2px; font-size: 12px; align-items: center; overflow-x: auto; }
.heat i { height: 12px; background: var(--panel-2); display: block; }
.heat i.on { background: var(--pc); opacity: calc(.35 + var(--a) * .65); }
.heat i.sel { outline: 1px solid var(--lamp); }

/* модалки */
.shade { position: fixed; inset: 0; background: rgba(8,9,30,.55); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { position: relative; width: min(760px, 100%); max-height: calc(100% - 32px); }
.hint { background: #3B3466; padding: 6px 10px; font-size: 14px; display: flex; gap: 8px; }
.hint::before { content: "💡"; }
.hints { display: grid; gap: 6px; margin-top: 10px; }
.cols { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; margin-top: 12px; touch-action: pan-x; }
.acol { flex: 0 0 44px; display: grid; gap: 4px; justify-items: center; }
.acol .stack { width: 34px; display: flex; flex-direction: column-reverse; gap: 2px; cursor: ns-resize; padding: 2px; touch-action: none; position: relative; }
.acol .stack b { height: 12px; background: var(--panel-2); display: block; }
.acol .stack b.g { background: #6B6F9E; }
.acol .stack b.p { background: var(--pc); }
.acol .stack b.o { box-shadow: inset 0 0 0 2px var(--st-over); }
.acol .stack b.l8 { margin-top: 4px; }
.acol.inr .stack { background: rgba(255,201,74,.10); box-shadow: inset 0 0 0 1px rgba(255,201,74,.45); }
.acol.vac .stack { background: repeating-linear-gradient(45deg, #34407A 0 6px, #2B3366 6px 12px); cursor: not-allowed; }
.acol small { font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.acol .tot { font-size: 12px; font-variant-numeric: tabular-nums; }
.acol .tot.o { color: var(--st-over); font-weight: 700; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sum { margin-top: 10px; font-size: 14px; color: var(--ink-dim); }
.sum b { color: var(--ink); }
.over { margin-top: 10px; background: #4A2230; padding: 10px; display: grid; gap: 8px; }
.over p { margin: 0; }
.free { display: grid; gap: 6px; margin-top: 6px; }
.free button { justify-content: space-between; }
.foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.summary ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.summary li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; background: var(--panel-2); padding: 8px; }
.summary li span:first-child { font-size: 18px; line-height: 1; }
.caption { font-size: 13px; color: var(--ink-dim); margin-top: 10px; }

.toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 45; background: var(--panel); box-shadow: inset 0 0 0 2px var(--lamp), 4px 4px 0 var(--shadow); padding: 8px 12px; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); }
.toast span { min-width: 0; }

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem("studio:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("studio:" + k, JSON.stringify(v)); } catch {} },
};

/* ================= модель ================= */
const NDAYS = DATA.days.length;
const DAYS = DATA.days.map(s => new Date(s + "T12:00:00"));
const WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
const dd = d => String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0");
const STAGES = ["Бриф", "Креатив", "Дизайн", "Защита", "Правки", "Ждём ОС клиента"];
const STAGE_SHORT = { "Ждём ОС клиента": "Ждём ОС" };
const PALETTE = ["#FF8FB5", "#7ED7C1", "#FFB86B", "#B79BFF", "#6FD0FF", "#F7E36B", "#A6E07A", "#FF9C7A", "#7FE8C0", "#F4A8FF", "#D9B98A", "#9EC2FF", "#FFD1A6", "#C7F09B", "#FFB3C7", "#A5F0E8", "#E0C3FF", "#FFE0A3", "#B8D8FF"];
const CFG = DATA.config || {};
const PEOPLE_COLORS = CFG.colors || {};
const has = (p, f) => (CFG.flags?.[p.name] || []).includes(f);
const STATE = {
  free: { label: "Свободный день", color: "#7ED7C1" }, calm: { label: "Спокойно", color: "#9BD86A" },
  flow: { label: "В потоке", color: "#FFD36A" }, over: { label: "Перегруз", color: "#FF6B5E" }, away: { label: "В отпуске", color: "#8FB8FF" },
};
const people = DATA.people.map((p, i) => ({ ...p, idx: i }));
const byName = Object.fromEntries(people.map(p => [p.name, p]));
const parseDl = s => {
  const m = /(\d{1,2})\.(\d{1,2})/.exec(s || "");
  return m ? new Date(2026, +m[2] - 1, +m[1], 12) : null;
};
const projects = DATA.projects.map((p, i) => {
  const team = {};
  for (const [n, arr] of Object.entries(p.team)) team[n] = Array.from({ length: NDAYS }, (_, d) => +arr[d] || 0);
  return { ...p, id: i, team, tent: /\?/.test(p.deadline || ""), dl: parseDl(p.deadline) };
});
const vacation = projects.find(p => p.section === "vacation");
const work = projects.filter(p => p.section === "work");
work.sort((a, b) => STAGES.indexOf(a.stage) - STAGES.indexOf(b.stage) || (a.dl || 9e15) - (b.dl || 9e15));
work.forEach((p, i) => p.color = PALETTE[i % PALETTE.length]);
projects.forEach(p => { if (!p.color) p.color = "#9AA0C8"; });
const won = projects.filter(p => p.section === "won");
const lost = projects.filter(p => p.section === "lost");
const pause = projects.filter(p => p.section === "pause");
const managers = {};
work.forEach(p => { if (p.manager) managers[p.manager] = (managers[p.manager] || 0) + 1; });
const TOP_MANAGER = Object.entries(managers).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
const dlIdx = p => { if (!p.dl) return -1; let k = -1; DAYS.forEach((d, i) => { if (d <= p.dl) k = i; }); return k; };
const mskNow = () => {
  const s = new Date().toLocaleString("en-CA", { timeZone: "Europe/Moscow", hour12: false });
  const [date, time] = s.split(", ");
  const [h, m] = time.split(":").map(Number);
  return { iso: date, hour: h + m / 60 };
};
const TODAY = (() => { const iso = mskNow().iso, i = DATA.days.findIndex(d => d >= iso); return i < 0 ? NDAYS - 1 : i; })();

const ROLES = JSON.parse(JSON.stringify(CFG.roles || { vadim: { label: "Владелец", edit: "all", seeAll: true } }));
if (ROLES.manager) { ROLES.manager.label += TOP_MANAGER; ROLES.manager.manager = TOP_MANAGER; }
const S = {
  role: store.get("role", "vadim"), day: TODAY, hour: clamp(mskNow().hour, 9, 20), tent: true,
  sound: false, music: false, lights: true, windowOpen: false, zoom: 2, panX: 0, panY: 0,
  plant: store.get("plant", 2), mugsBroken: store.get("mugs", 0), streak: 0, best: store.get("best", 0),
};
const role = () => ROLES[S.role] || ROLES.vadim;
const canEdit = name => { const r = role(); return r.edit === "all" || (Array.isArray(r.edit) && r.edit.includes(name)); };
const canEditAny = () => !!role().edit;
const canSeeFatigue = name => role().seeAll || role().self === name;
const canSeeBudget = p => role().seeAll || (role().manager && p.manager === role().manager);

const counts = p => p.section !== "vacation" && (S.tent || !p.tent);
const hoursOf = (p, n, d) => p.team[n]?.[d] || 0;
const loadOf = (n, d, skip) => projects.reduce((s, p) => s + (p !== skip && counts(p) ? hoursOf(p, n, d) : 0), 0);
const onVac = (n, d) => !!vacation && hoursOf(vacation, n, d) > 0;
const stateOf = (n, d) => {
  if (onVac(n, d)) return "away";
  const l = loadOf(n, d);
  return l > 8 ? "over" : l >= 6 ? "flow" : l >= 1 ? "calm" : "free";
};
const tasksOf = (n, d) => projects.filter(p => counts(p) && hoursOf(p, n, d) > 0).map(p => ({ p, h: hoursOf(p, n, d) }));
const vacUntil = (n, d) => { let k = d; while (k + 1 < NDAYS && onVac(n, k + 1)) k++; return DAYS[k]; };

/* усталость: копится от переработок, спадает в лёгкие дни, выходные и отпуск */
function fatigue(n, upto, alloc) {
  let f = 20; const log = [];
  for (let i = 0; i <= upto; i++) {
    let delta;
    if (onVac(n, i)) { delta = -25; log.push({ i, delta, k: "vac" }); }
    else {
      const h = alloc ? alloc(i) : loadOf(n, i);
      delta = h > 6 ? 5 * (h - 6) : -3 * (6 - h);
      log.push({ i, delta, k: delta > 0 ? "over" : "light" });
    }
    f = clamp(f + delta, 0, 100);
    if (i % 5 === 4 && i < upto) { f = clamp(f - 30, 0, 100); log.push({ i, delta: -30, k: "wknd" }); }
  }
  return { f: Math.round(f), log };
}
function moodlets(n, d) {
  const { log } = fatigue(n, d);
  const recent = log.filter(e => e.i > d - 5);
  const groups = { over: [], light: [], wknd: [], vac: [] };
  recent.forEach(e => groups[e.k].push(e));
  const span = arr => { const a = DAYS[arr[0].i], b = DAYS[arr[arr.length - 1].i]; return arr.length > 1 ? dd(a) + "–" + dd(b) : dd(a); };
  const out = [];
  if (groups.over.length) out.push({ v: groups.over.reduce((s, e) => s + e.delta, 0), t: "переработка " + span(groups.over) });
  if (groups.light.length) out.push({ v: groups.light.reduce((s, e) => s + e.delta, 0), t: "лёгкие дни" });
  if (groups.wknd.length) out.push({ v: groups.wknd.reduce((s, e) => s + e.delta, 0), t: "выходные" });
  if (groups.vac.length) out.push({ v: groups.vac.reduce((s, e) => s + e.delta, 0), t: "отпуск" });
  return out.filter(m => m.v);
}
const fatLevel = f => f < 30 ? ["бодрячком", "#9BD86A"] : f < 60 ? ["норм", "#FFD36A"] : f < 80 ? ["устал", "#FFA05E"] : ["на грани", "#FF6B5E"];

/* ================= звук (синтез, без файлов) ================= */
const snd = (() => {
  let ac = null, master, musicGain, noiseBuf, streetNode = null, musicTimer = null, beat = 0, nextT = 0;
  const ensure = () => {
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    ac = new AC(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = .32; musicGain.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    return ac;
  };
  const ok = () => S.sound && ensure();
  const tone = (f, dur, type = "square", vol = .12, t0 = 0, slide = 0, dest) => {
    const t = ac.currentTime + t0, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + .02);
  };
  const noise = (dur, vol = .2, freq = 1200, type = "bandpass", t0 = 0, dest) => {
    const t = ac.currentTime + t0, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || master); s.start(t, Math.random()); s.stop(t + dur + .02);
  };
  const CH = [[130.8, 164.8, 196, 246.9], [110, 130.8, 164.8, 196], [87.3, 110, 130.8, 164.8], [98, 123.5, 146.8, 174.6]];
  const PENTA = [523.3, 587.3, 659.3, 784, 880];
  const schedule = () => {
    const spb = 60 / 72;
    while (nextT < ac.currentTime + .4) {
      const bar = Math.floor(beat / 4) % 4, b = beat % 4, t0 = nextT - ac.currentTime;
      if (b === 0) CH[bar].forEach(f => { tone(f, spb * 3.6, "triangle", .05, t0, 0, musicGain); tone(f * 2, spb * 2, "sine", .015, t0 + .02, 0, musicGain); });
      if (b === 0 || b === 2) tone(70, .28, "sine", .35, t0, -35, musicGain);
      if (b === 1 || b === 3) noise(.12, .12, 300, "lowpass", t0 + .02, musicGain);
      noise(.04, .05, 7000, "highpass", t0 + spb / 2, musicGain);
      if (Math.random() < .35) tone(PENTA[Math.floor(Math.random() * 5)] / (Math.random() < .5 ? 1 : 2), spb * .9, "sine", .035, t0 + (Math.random() < .5 ? 0 : spb / 2), 0, musicGain);
      if (Math.random() < .5) noise(.02, .03, 3000, "bandpass", t0 + Math.random() * spb, musicGain);
      nextT += spb; beat++;
    }
  };
  return {
    unlock() { if (ensure() && ac.state === "suspended") ac.resume(); },
    blip(f = 660) { if (ok()) tone(f, .07, "square", .06); },
    laugh() { if (!ok()) return; [0, .11, .22, .33, .44].forEach((t, i) => tone(720 - i * 40, .08, "square", .07, t, -120)); },
    ouch() { if (ok()) tone(500, .18, "sawtooth", .07, 0, 350); },
    hmph() { if (ok()) { tone(180, .25, "square", .06, 0, -60); } },
    purr() { if (!ok()) return; for (let i = 0; i < 14; i++) noise(.06, .18, 140, "lowpass", i * .075); },
    splash() { if (ok()) { noise(.35, .25, 900, "bandpass"); tone(300, .1, "sine", .08, .02, -150); } },
    crash() { if (ok()) { noise(.5, .35, 3500, "highpass"); [0, .05, .11].forEach(t => tone(1800 + Math.random() * 900, .08, "triangle", .06, t)); } },
    whoosh() { if (ok()) noise(.25, .15, 600, "bandpass"); },
    ding() { if (ok()) { tone(988, .25, "sine", .1); tone(1318, .4, "sine", .08, .08); } },
    thud() { if (ok()) tone(120, .15, "sine", .2, 0, -60); },
    sigh() { if (ok()) noise(.6, .12, 500, "lowpass"); },
    printer() { if (!ok()) return; for (let i = 0; i < 8; i++) tone(220 + (i % 2) * 40, .07, "square", .04, i * .09); },
    drop() { if (ok()) { tone(900, .08, "sine", .08); tone(1200, .1, "sine", .06, .08); } },
    tada() { if (!ok()) return; [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, "square", .06, i * .09)); },
    street(on) {
      if (!ok()) { if (streetNode) { streetNode.stop(); streetNode = null; } return; }
      if (on && !streetNode) {
        const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = noiseBuf; s.loop = true; f.type = "lowpass"; f.frequency.value = 700; g.gain.value = .06;
        s.connect(f); f.connect(g); g.connect(master); s.start(); streetNode = s;
      } else if (!on && streetNode) { streetNode.stop(); streetNode = null; }
    },
    music(on) {
      if (on) { if (!ok()) return false; if (!musicTimer) { nextT = ac.currentTime + .1; musicTimer = setInterval(schedule, 100); } return true; }
      clearInterval(musicTimer); musicTimer = null; return false;
    },
    mute() { this.music(false); this.street(false); },
  };
})();

/* ================= пиксели: человечки ================= */
const FREE_HEAD = ["....................", "......nnnnnnnn......", ".....nnnnnnnnnn.....", "....nnnnnnnnnnnn....", "....nnssssssssnn....", "....nnsessssesnn....", "....nnssssssssnn....", "....nnsssmmsssnn....", "....nnnssssssnnn....", ".....nnnnnnnnnn.....", "......nnnnnnnn......", "....................", "........ssss........"];
const FREE_COLORS = { n: "#6B6F9A", s: "#E8C3A3", e: "#2B2A33", m: "#B5524A", c: "#6B6F9A", t: "#585C86", h: "#6B6F9A" };
const spriteCache = new Map();
function sprite(p, o = {}) {
  const key = p.name + JSON.stringify(o);
  if (spriteCache.has(key)) return spriteCache.get(key);
  const colors = p.colors || FREE_COLORS, head = p.head || FREE_HEAD;
  const rows = o.standing ? 20 : 16;
  const g = Array.from({ length: rows }, () => Array(20).fill(null));
  for (let r = 13; r < 16; r++) {
    const c0 = r === 13 ? 4 : 3, c1 = r === 13 ? 15 : 16;
    for (let c = c0; c <= c1; c++) {
      let col = colors.c;
      if (p.plaid && (c === 5 || c === 6 || c === 13 || c === 14 || (r === 14 && !(c >= 8 && c <= 11)))) col = colors.p;
      if (has(p, "curls") && (c === 3 || c === 4 || c === 15 || c === 16)) col = colors.c;
      if (c >= 8 && c <= 11) col = o.back ? colors.c : colors.t;
      g[r][c] = col;
    }
  }
  head.forEach((line, r) => [...line].forEach((ch, c) => {
    if (ch === ".") return;
    if (!o.cat && (ch === "K" || (ch === "y" && has(p, "catOwner")))) return;
    let col = colors[ch];
    if (has(p, "curls") && ch === "h" && (r * 3 + c) % 4 === 0) col = colors.d;
    if (o.back && r < 12) {
      if (r <= 4 && "kwev".includes(ch)) col = colors.k || colors.h;
      else if (ch !== "k" && ch !== "n") col = colors.h || colors.k || colors.n;
    }
    g[r][c] = col;
  }));
  if (o.standing) {
    const pants = has(p, "darkPants") ? "#1E1E1E" : "#3B4570", shoe = "#151515";
    for (const [c0, lift] of [[6, o.phase === 1], [11, o.phase === 2]]) {
      const bottom = lift ? 18 : 19;
      for (let r = 16; r <= bottom; r++) for (let c = c0; c < c0 + 3; c++) g[r][c] = r === bottom ? shoe : pants;
    }
  }
  const cv = document.createElement("canvas"); cv.width = 20; cv.height = rows;
  const x = cv.getContext("2d");
  g.forEach((row, r) => row.forEach((col, c) => { if (col) { x.fillStyle = col; x.fillRect(c, r, 1, 1); } }));
  spriteCache.set(key, cv);
  return cv;
}

/* ================= сцена ================= */
const W = 432, H = 280, WALL = 88;
const off = document.createElement("canvas"); off.width = W; off.height = H;
const g = off.getContext("2d");
const cv = $("#cv"), ctx = cv.getContext("2d");
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

// Места за столами (по порядку людей): угловой стол у стены, «остров» на четверых, два стола у «объектива».
// x, y — левый верх спрайта; z — порядок отрисовки; surf — край стола, где лежат бумаги и кружка.
const SEATS = [
  { x: 42, y: 87, pose: "front", z: 99, furn: "corner", surf: [24, 101], plate: [52, 119] },
  { x: 160, y: 115, pose: "front", z: 131, furn: "island", surf: [150, 129], plate: [170, 106] },
  { x: 226, y: 115, pose: "front", z: 131, furn: "island", surf: [216, 129], plate: [236, 106] },
  { x: 160, y: 142, pose: "back", z: 158, furn: "island", surf: [150, 139], plate: [170, 168] },
  { x: 226, y: 142, pose: "back", z: 158, furn: "island", surf: [216, 139], plate: [236, 168] },
  { x: 150, y: 224, pose: "back", z: 240, furn: "bottom", surf: [122, 217], plate: [160, 249] },
  { x: 234, y: 224, pose: "back", z: 240, furn: "bottom", surf: [206, 217], plate: [244, 249] },
];
// Места, куда люди уходят по своим делам
const SPOTS = [
  { id: "m1", kind: "meet", x: 322, y: 124, pose: "front", z: 139 }, { id: "m2", kind: "meet", x: 350, y: 124, pose: "front", z: 139 },
  { id: "m3", kind: "meet", x: 322, y: 150, pose: "back", z: 167 }, { id: "m4", kind: "meet", x: 350, y: 150, pose: "back", z: 167 },
  { id: "so1", kind: "sofa", x: 326, y: 220, pose: "back", z: 236 }, { id: "so2", kind: "sofa", x: 352, y: 220, pose: "back", z: 236 }, { id: "so3", kind: "sofa", x: 378, y: 220, pose: "back", z: 236 },
  { id: "bb", kind: "bean", x: 104, y: 236, pose: "front", z: 252 },
  { id: "st", kind: "stand", x: 378, y: 87, pose: "stand", z: 107 },

function drawActor(a, t) {
  if (a.mode === "hidden" || a.mode === "away") return;
  const n = a.p.name, now = t;
  let x = a.x, y = a.y;
  if (a.shakeUntil > now) x += Math.round(Math.sin(now / 25) * 2);
  if (a.mode === "walking") {
    const phase = 1 + Math.floor(now / 140) % 2;
    g.drawImage(sprite(a.p, { standing: true, phase, back: a.dir === "up" }), Math.round(x), Math.round(y - 1));
    return;
  }
  const turned = a.offendedUntil > now || (a.spinUntil > now && Math.floor(now / 180) % 2);
  const item = a.t?.item ?? (a.t?.spot ? (a.t.spot.kind === "bar" || a.t.spot.kind === "cooler" ? "cup" : a.t.spot.kind === "meet" ? null : "laptop") : null);
  if (isStand(a.pose)) {
    const back = a.pose === "standBack" || turned;
    g.drawImage(sprite(a.p, { standing: true, back }), Math.round(x), Math.round(y));
    if (item === "cup" && !back) { R(x + 15, y + 12, 3, 4, "#FFFFFF"); R(x + 15, y + 12, 3, 1, "#7A5233"); }
    if (item === "laptop" && a.t?.spot?.kind === "stand") { R(x + 3, y + 14, 14, 3, "#B9B4CC"); R(x + 4, y + 13, 12, 1, "#D6D2E4"); }
    return;
  }
  const atDesk = a.t?.k === "desk", l = loadOf(n, S.day), st = stateOf(n, S.day);
  if (atDesk && l > 0 && !turned) y += Math.floor((now / (st === "over" ? 110 : st === "flow" ? 170 : 300) + a.bob) % 2);
  if (atDesk && l === 0 && !turned) x += Math.round(Math.sin(now / 700 + a.bob));
  const back = a.pose === "back" || !!turned;
  g.drawImage(sprite(a.p, { back }), Math.round(x), Math.round(y));
  if (item === "laptop" && a.pose === "back") { R(x + 4, y - 1, 12, 1, "rgba(127,227,255,.55)"); }
  if (item === "laptop" && a.pose === "front" && !atDesk) { R(x + 3, y + 11, 14, 4, "#B9B4CC"); R(x + 4, y + 11, 12, 1, "#D6D2E4"); }
  if (atDesk && st === "over" && Math.random() < .08 && !REDUCED) parts.push({ x: x + 8 + Math.random() * 4, y: y - 2, vx: (Math.random() - .5) * 6, vy: -10, life: 1.6, c: "rgba(200,200,220,.8)", s: 2 });
}
function feet(a) {
  if (a.mode === "hidden" || a.mode === "away") return [a.seat.x + 10, a.seat.y + 17];
  return [a.x + 10, a.y + (a.mode === "walking" || isStand(a.pose) ? 20 : 16)];
}
function drawCat(t) {
  const x = Math.round(cat.x), y = Math.round(cat.y), f = cat.face, leg = cat.sit ? 0 : Math.floor(t / 150) % 2;
  R(x, y + 2, 9, 4, "#141414"); R(f > 0 ? x + 7 : x - 2, y, 4, 4, "#141414");
  R(f > 0 ? x + 7 : x - 2, y - 1, 1, 1, "#141414"); R(f > 0 ? x + 10 : x + 1, y - 1, 1, 1, "#141414");
  R(f > 0 ? x + 8 : x - 1, y + 1, 1, 1, "#E8C840"); R(f > 0 ? x + 10 : x + 1, y + 1, 1, 1, "#E8C840");
  R(f > 0 ? x - 2 : x + 9, y + (Math.floor(t / 500) % 2), 2, 3, "#141414");
  if (!cat.sit) { R(x + 1 + leg, y + 6, 1, 2, "#141414"); R(x + 6 - leg, y + 6, 1, 2, "#141414"); }
}

const scene = $("#scene"), layer = $("#layer");
function computeLayout() {
  const r = scene.getBoundingClientRect();
  const compact = innerWidth <= 720;
  document.documentElement.classList.toggle("compact", compact);
  const fit = Math.min(r.width / W, r.height / H);
  // на телефоне по умолчанию сцена заполняет высоту и двигается пальцем; ⊖ — вся студия целиком
  const sc = compact && S.zoom > 1 ? Math.max(fit, r.height / H) : fit;
  const sw = W * sc, sh = H * sc;
  const maxPanX = Math.max(0, (sw - r.width) / 2), maxPanY = Math.max(0, (sh - r.height) / 2);
  S.panX = clamp(S.panX, -maxPanX, maxPanX); S.panY = clamp(S.panY, -maxPanY, maxPanY);
  layout = { S: sc, ox: (r.width - sw) / 2 + S.panX, oy: (r.height - sh) / 2 + S.panY, cw: r.width, ch: r.height };
  scene.style.setProperty("--u", sc.toFixed(3));
  layer.style.setProperty("--u", sc.toFixed(3));
  placeBoard(); placePlates();
}
const toScreen = (x, y) => [layout.ox + x * layout.S, layout.oy + y * layout.S];
const toScene = (cx, cy) => { const r = scene.getBoundingClientRect(); return [(cx - r.left - layout.ox) / layout.S, (cy - r.top - layout.oy) / layout.S]; };

function dlText(p) {
  if (!p.dl) return { t: "без срока", cls: "", diff: 99 };
  const diff = Math.round((p.dl - DAYS[S.day]) / 864e5);
  if (diff < 0) return { t: `${-diff} дн. назад`, cls: "late", diff };
  if (diff === 0) return { t: "сегодня", cls: "burn", diff };
  if (diff === 1) return { t: "завтра", cls: "burn", diff };
  return { t: dd(p.dl) + (p.tent ? "?" : ""), cls: "", diff };
}
const teamToday = p => people.filter(pp => counts(p) && hoursOf(p, pp.name, S.day) > 0).map(pp => ({ pp, h: hoursOf(p, pp.name, S.day) }));
function cardHTML(p) {

}

function paintAt(ev, first) {

  paint.d = d;

    people.forEach(p => { if (p.name === "Фриланс") return; if (!onVac(p.name, i)) { cap += 8; tot += loadOf(p.name, i); } });
    const ratio = cap ? tot / cap : 0, c = ratio > 1 ? STATE.over.color : ratio >= .75 ? STATE.flow.color : STATE.calm.color;
    return `<button class="day${i === S.day ? " sel" : ""}${i === TODAY ? " today" : ""}${i % 5 === 0 && i ? " wk" : ""}" data-d="${i}" title="Загрузка студии ${Math.round(ratio * 100)}%"><b>${WD[d.getDay()]}${i === TODAY ? "•" : ""}</b><span>${dd(d)}</span><i style="--w:${Math.min(100, ratio * 100)}%;--bc:${c}"></i></button>`;
  }).join("");
  $("#days").querySelectorAll(".day").forEach(b => b.onclick = () => setDay(+b.dataset.d));
}
const fmtH = h => String(Math.floor(h)).padStart(2, "0") + ":" + String(Math.round((h % 1) * 60)).padStart(2, "0");
function renderClock() { $("#clock").textContent = `${WD[DAYS[S.day].getDay()]} ${dd(DAYS[S.day])} · ${fmtH(S.hour)}`; $("#hourOut").textContent = fmtH(S.hour); $("#hour").value = S.hour; }
function setDay(d) { S.day = clamp(d, 0, NDAYS - 1); snd.blip(500 + d * 12); refresh(true); $("#days .sel")?.scrollIntoView({ inline: "nearest", block: "nearest" }); }
function refresh(instant) {
  bsCache.clear();
  renderBoard(); renderPlates(); renderDays(); renderClock(); updateTargets(instant);
  if (panelFor?.kind === "person") openPerson(panelFor.name);
  else if (panelFor?.kind === "project") openProject(panelFor.pid);
}
function setSound(on) {
  S.sound = on; $("#sound").setAttribute("aria-pressed", on); $("#sound").textContent = on ? "🔊" : "🔇";
  if (on) { snd.unlock(); snd.ding(); if (S.windowOpen) snd.street(true); } else { snd.mute(); S.music = false; }
}
$("#role").innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}">${esc(r.label)}</option>`).join("");
$("#role").value = S.role;
$("#role").onchange = e => { S.role = e.target.value; store.set("role", S.role); refresh(); toast(role().edit ? (role().edit === "all" ? "Можно ставить кого угодно" : "Можно ставить: " + role().edit.map(n => byName[n].short).join(", ")) : "Только просмотр"); };
$("#tent").onclick = () => { S.tent = !S.tent; $("#tent").setAttribute("aria-pressed", S.tent); toast(S.tent ? "Предварительные проекты (срок «?») — в загрузке" : "Считаю только точные проекты"); refresh(); };
$("#sound").onclick = () => setSound(!S.sound);
$("#sumBtn").onclick = openSummary;
$("#dockBtn").onclick = () => dock.hidden ? openDock() : closeDock();
$("#hour").oninput = e => { const prev = S.hour; S.hour = +e.target.value; renderClock(); updateTargets(Math.abs(S.hour - prev) > 1.01); };
$("#now").onclick = () => { S.day = TODAY; S.hour = clamp(mskNow().hour, 9, 20); refresh(true); };
let playT = null;
$("#play").onclick = () => {
  if (playT) { clearInterval(playT); playT = null; $("#play").textContent = "▶"; return; }
  if (S.hour >= 19.9) S.hour = 9;
  $("#play").textContent = "⏸";
  playT = setInterval(() => { S.hour = Math.min(20, S.hour + .25); renderClock(); updateTargets(false); if (S.hour >= 20) { clearInterval(playT); playT = null; $("#play").textContent = "▶"; } }, 450);
};
$("#zoom").onclick = () => { S.zoom = S.zoom === 1 ? 2 : 1; S.panX = S.panY = 0; $("#zoom").textContent = S.zoom === 1 ? "⊕" : "⊖"; computeLayout(); };
$("#zoom").textContent = "⊖";
$("#proto").textContent = `прототип · снимок таблицы ${DATA.snapshot} · в таблицу не пишется`;
shade.addEventListener("click", e => { if (e.target === shade) closeAssign(); });
addEventListener("keydown", e => {
  if (e.key !== "Escape" && (!shade.hidden)) return;
  if (e.key === "Escape") { if (!shade.hidden) closeAssign(); else if (!dock.hidden) closeDock(); else if (!panel.hidden) closePanel(); else stopPick(); }
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") setDay(S.day + 1); if (e.key === "ArrowLeft") setDay(S.day - 1);
});

/* ================= цикл ================= */
let last = performance.now();
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  stepActors(dt);
  // зевота и спонтанные пузыри
  if (!REDUCED && Math.random() < dt * .08) {
    const a = actors[Math.floor(Math.random() * actors.length)];
    if (a.mode === "placed" && a.t?.k === "desk" && fatigue(a.p.name, S.day).f >= 60) say(a, "*зевает*", 1500);
    else if (a.mode === "placed" && ["bar", "cooler", "kitchen"].includes(a.t?.spot?.kind)) say(a, ["…", "а ты видел бриф?", "кофе кончается", "ха-ха"][Math.floor(Math.random() * 4)], 1400);
    else if (a.mode === "placed" && a.t?.spot?.kind === "meet") say(a, ["а если…", "идея!", "нет, не то", "вау-эффект?"][Math.floor(Math.random() * 4)], 1400);
    else if (a.mode === "placed" && a.t?.k === "desk" && loadOf(a.p.name, S.day) === 0 && Math.random() < .5) { a.spinUntil = t + 1200; }
  }
  render(t); placePlates();
  for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; if (t > b.until) { b.el.remove(); bubbles.splice(i, 1); } else placeBubble(b); }
  requestAnimationFrame(frame);
}
new ResizeObserver(computeLayout).observe(scene);
computeLayout(); refresh(true);
requestAnimationFrame(frame);
const hideLoading = () => { const l = $("#loading"); l.style.opacity = 0; setTimeout(() => l.remove(), 320); if (!store.get("seenSummary:" + DATA.days[TODAY], false)) { store.set("seenSummary:" + DATA.days[TODAY], true); openSummary(); } };
Promise.race([document.fonts?.ready || Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(() => setTimeout(hideLoading, REDUCED ? 0 : 700));
</script>
